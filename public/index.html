<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KG Miner - Dashboard Pro v2</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #0B0F19; --bg-card: #151B2B;
            --text-main: #F1F5F9; --text-muted: #64748B;
            --accent-green: #10B981; --accent-blue: #3B82F6;
            --accent-red: #EF4444; --accent-gold: #F59E0B;
            --border-color: #232D42;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--bg-main); color: var(--text-main); font-family: 'Inter', sans-serif; padding-bottom: 40px; }
        .app-container { max-width: 600px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .alert-banner { background: rgba(239, 68, 68, 0.1); color: #FCA5A5; padding: 10px; border-radius: 8px; text-align: center; font-size: 0.75rem; font-weight: bold; border: 1px solid rgba(239,68,68,0.2); }
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border-color); }
        header h1 { font-size: 1.6rem; background: linear-gradient(90deg, #3B82F6, #10B981); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-weight: 700; }
        .status-indicator { display: flex; align-items: center; gap: 8px; background: var(--bg-card); padding: 6px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; border: 1px solid var(--border-color); }
        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot.online { background-color: var(--accent-green); box-shadow: 0 0 10px var(--accent-green); }
        .dot.offline { background-color: var(--accent-red); box-shadow: 0 0 10px var(--accent-red); }
        
        .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px; padding: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); }
        .input-group { margin-bottom: 12px; }
        .input-group:last-child { margin-bottom: 0; }
        .input-group label { display: block; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: 600; }
        input, select { width: 100%; background-color: #070A11; border: 1px solid var(--border-color); color: var(--text-main); padding: 12px; border-radius: 8px; font-size: 0.95rem; outline: none; font-family: 'JetBrains Mono', monospace; }
        input:focus, select:focus { border-color: var(--accent-blue); }
        
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .stat-card { text-align: center; padding: 12px; }
        .stat-card h3 { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; }
        .stat-card .value { font-size: 1.4rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; color: var(--text-main); }
        
        .card-full { grid-column: span 2; }
        .highlight-hash { background: linear-gradient(145deg, #151B2B, #1A233A); border-color: rgba(59,130,246,0.3); }
        .highlight-hash .value { color: var(--accent-green); font-size: 1.8rem; text-shadow: 0 0 15px rgba(16,185,129,0.3); }
        
        .highlight-gold { border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.05); }
        .highlight-gold .value { color: var(--accent-gold); font-size: 1.8rem; text-shadow: 0 0 15px rgba(245,158,11,0.3); }
        
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .controls #btn-reset { grid-column: span 2; }
        .btn { padding: 14px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 700; cursor: pointer; color: white; text-transform: uppercase; transition: 0.2s; }
        .btn:active { transform: scale(0.96); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; filter: grayscale(100%); }
        .btn.primary { background: linear-gradient(135deg, #2563EB, #3B82F6); }
        .btn.danger { background: linear-gradient(135deg, #DC2626, #EF4444); }
        .btn.secondary { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-muted); }
        
        .logs { background-color: #05080F; border: 1px solid var(--border-color); padding: 16px; border-radius: 12px; }
        .logs h3 { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; }
        .log-container { height: 120px; overflow-y: auto; font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; display: flex; flex-direction: column; gap: 6px; }
        .log-entry { display: flex; gap: 6px; border-bottom: 1px dashed #1E293B; padding-bottom: 4px; }
        .log-time { color: var(--accent-blue); }
        .log-text { color: #E2E8F0; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="alert-banner">⚠️ Simulação Educacional v2.0</div>

        <header>
            <h1>KG Miner</h1>
            <div class="status-indicator">
                <span id="ws-status" class="dot offline"></span>
                <span id="ws-text">Offline</span>
            </div>
        </header>

        <section class="card">
            <div class="input-group">
                <label>Modo de Mineração</label>
                <select id="mode-select">
                    <option value="POOL">Pool (Recompensa Constante por Acertos)</option>
                    <option value="SOLO">Solo (Recompensa Alta só por Blocos)</option>
                </select>
            </div>
            <div class="input-group">
                <label>Workers Simulados (Threads)</label>
                <input type="number" id="workers-input" min="1" max="16" value="4">
            </div>
        </section>

        <section class="dashboard">
            <div class="card stat-card card-full highlight-hash">
                <h3>Potência (Hashrate)</h3>
                <div class="value" id="hashrate-val">0.00 H/s</div>
            </div>
            
            <div class="card stat-card card-full highlight-gold">
                <h3>Saldo Simulado (BTC)</h3>
                <div class="value" id="balance-val">0.00000000</div>
            </div>

            <div class="card stat-card">
                <h3>Acertos (Shares)</h3>
                <div class="value" id="shares-val" style="color: #60A5FA;">0</div>
            </div>
            <div class="card stat-card">
                <h3>Blocos</h3>
                <div class="value" id="blocks-val" style="color: #34D399;">0</div>
            </div>

            <div class="card stat-card">
                <h3>Temperatura</h3>
                <div class="value" id="temp-val" style="color: #F87171;">40.0 °C</div>
            </div>
            <div class="card stat-card">
                <h3>Consumo Energético</h3>
                <div class="value" id="power-val" style="color: #A78BFA;">0 W</div>
            </div>
        </section>

        <section class="controls">
            <button id="btn-start" class="btn primary">Iniciar</button>
            <button id="btn-stop" class="btn danger" disabled>Parar</button>
            <button id="btn-reset" class="btn secondary">Limpar Dados</button>
        </section>

        <section class="logs">
            <h3>Terminal de Atividade</h3>
            <div class="log-container" id="log-box"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
